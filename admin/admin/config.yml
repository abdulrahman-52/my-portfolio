backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "projects"
    label: "المشاريع"
    folder: "content/projects"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "عنوان المشروع", name: "title", widget: "string" }
      - { label: "وصف قصير", name: "description", widget: "text" }
      - { label: "صورة المشروع", name: "image", widget: "image" }
      - { label: "ملف مرفق (PDF/ZIP)", name: "file", widget: "file", required: false }
      - { label: "التاريخ", name: "date", widget: "datetime" }
      - { label: "تفاصيل المشروع", name: "body", widget: "markdown" }
